name: CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build + publish GHCR images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend jars
        working-directory: backend
        run: mvn -B -q -DskipTests install

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build + push images
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          REG="ghcr.io/${OWNER,,}"
          for svc in auth-service employee-service employee-consumer; do
            IMG="${REG}/${REPO,,}-${svc}"
            docker build -f "backend/${svc}/Dockerfile" -t "${IMG}:${TAG}" -t "${IMG}:latest" .
            docker push "${IMG}:${TAG}"
            docker push "${IMG}:latest"
          done
          IMG="${REG}/${REPO,,}-frontend"
          docker build -f frontend/employee-portal/Dockerfile -t "${IMG}:${TAG}" -t "${IMG}:latest" .
          docker push "${IMG}:${TAG}"
          docker push "${IMG}:latest"
